    <radialGradient id="elglow"><stop offset="0" stop-color="#7FE7FF" stop-opacity="0.55"/><stop offset="0.55" stop-color="#7FE7FF" stop-opacity="0.138"/><stop offset="1" stop-color="#7FE7FF" stop-opacity="0"/></radialGradient>
