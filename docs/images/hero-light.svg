  </g>
  <g font-family="ui-sans-serif, -apple-system, 'SF Pro Display', 'Segoe UI', Roboto, Helvetica, Arial, sans-serif">
    <text x="72" y="118" font-size="15" font-weight="700" letter-spacing="2.4" fill="#0A7FA8">ARDUINO NANO · SERVO · EL-FOLIE · ASCOM</text>
    <text x="70" y="190" font-size="68" font-weight="800" letter-spacing="-1.8" fill="#111522">FlipFlat <tspan fill="#0A7FA8">Panel</tspan></text>
    <text x="72" y="238" font-size="22" fill="#4E586F">Motorisierter Deckel und dimmbares Flat-Panel</text>
    <text x="72" y="268" font-size="22" fill="#4E586F">in einem Gerät – automatisch gesteuert aus N.I.N.A.</text>
    <rect x="72" y="316" width="152" height="34" rx="17" fill="#FFFFFF" stroke="#D5DAE4"/>
    <text x="90" y="338" font-size="12" font-weight="700" letter-spacing="1.2" fill="#0A7FA8">COVER</text>
    <text x="143" y="338" font-size="14" font-weight="600" fill="#111522">Auf / Zu</text>
    <rect x="236.2" y="316" width="121" height="34" rx="17" fill="#FFFFFF" stroke="#D5DAE4"/>
    <text x="254.2" y="338" font-size="12" font-weight="700" letter-spacing="1.2" fill="#0A7FA8">FLAT</text>
    <text x="299" y="338" font-size="14" font-weight="600" fill="#111522">0–255</text>
    <rect x="369.6" y="316" width="167" height="34" rx="17" fill="#FFFFFF" stroke="#D5DAE4"/>
    <text x="387.6" y="338" font-size="12" font-weight="700" letter-spacing="1.2" fill="#0A7FA8">ASCOM</text>
    <text x="441" y="338" font-size="14" font-weight="600" fill="#111522">Platform 7</text>
