    <rect x="300" y="-70" width="18" height="140" rx="3" fill="#2B2F38" opacity="0.9"/>
    <!-- Servo am Scharnier -->
    <rect x="6" y="-100" width="46" height="24" rx="4" fill="#2B2F38" stroke="#111522" stroke-width="1.5"/>
    <circle cx="16" cy="-88" r="4" fill="#38C6EE"/>
