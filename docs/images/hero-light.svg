      <rect x="6" y="8" width="7" height="140" rx="3.5" fill="#FFFFFF"/>
    </g>
    <circle cx="-10" cy="-78" r="6" fill="#2B2F38" stroke="#111522" stroke-width="1.5"/>
  </g>
