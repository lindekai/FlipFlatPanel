<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="440" viewBox="0 0 1280 440" role="img" aria-labelledby="t d">
  <title id="t">FlipFlat Panel</title>
  <desc id="d">DIY Flip-Flat-Panel für die Astrofotografie: ein Servo klappt den Teleskopdeckel auf und zu, eine dimmbare EL-Folie im Deckel liefert das Licht für Flat-Frames. Gesteuert per ASCOM aus N.I.N.A.</desc>
  <defs>
    <radialGradient id="bg" cx="0.78" cy="0.45" r="0.7"><stop offset="0" stop-color="#FFFFFF"/><stop offset="1" stop-color="#EEF1F6"/></radialGradient>
    <radialGradient id="elglow"><stop offset="0" stop-color="#38C6EE" stop-opacity="0.45"/><stop offset="0.55" stop-color="#38C6EE" stop-opacity="0.113"/><stop offset="1" stop-color="#38C6EE" stop-opacity="0"/></radialGradient>
    <linearGradient id="ramp" x1="0" x2="1"><stop offset="0" stop-color="#38C6EE" stop-opacity="0"/><stop offset="1" stop-color="#38C6EE" stop-opacity="0.9"/></linearGradient>
    <filter id="sh" x="-10%" y="-20%" width="120%" height="150%"><feDropShadow dx="0" dy="10" stdDeviation="14" flood-color="#000000" flood-opacity="0.12"/></filter>
    <filter id="bloom" x="-200%" y="-20%" width="500%" height="140%"><feGaussianBlur stdDeviation="6"/></filter>
    <marker id="arrow" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#9AA3BC"/></marker>
  </defs>
  <rect width="1280" height="440" rx="24" fill="url(#bg)"/>
  <g>
