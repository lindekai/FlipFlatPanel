  </g>
  <g transform="translate(872 178) rotate(18) scale(0.86)">
    <!-- Tubus -->
    <g filter="url(#sh)">
      <rect x="110" y="-64" width="270" height="128" rx="10" fill="#FBFCFE" stroke="#B9C0CE" stroke-width="2"/>
      <rect x="0" y="-74" width="122" height="148" rx="8" fill="#FBFCFE" stroke="#B9C0CE" stroke-width="2"/>
