    <rect x="-18" y="-78" width="16" height="156" rx="4" fill="none" stroke="#9AA3BC" stroke-width="1.6" stroke-dasharray="5 5"/>
    <path d="M20.0 72.0 A186 186 0 0 1 -190.5 -123.0" fill="none" stroke="#9AA3BC" stroke-width="2" stroke-dasharray="2 7" stroke-linecap="round" marker-end="url(#arrow)"/>
    <!-- Klappe mit leuchtender EL-Folie -->
    <g transform="translate(-10 -78) rotate(112)">
      <ellipse cx="34" cy="78.0" rx="70" ry="112.0" fill="url(#elglow)"/>
      <rect x="-8" y="0" width="16" height="156" rx="4" fill="#E6EAF1" stroke="#9AA3BC" stroke-width="1.5"/>
